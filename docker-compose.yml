services:
  db:
    image: postgres:15-alpine
    container_name: visionguard-db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - visionguard-net
    # Publishes NO port to the outside host network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: visionguard-web
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - MODEL_PATH=/app/models/champion_model.keras
    volumes:
      # Model file mounted at runtime instead of being baked into image
      - ./models/champion_model.keras:/app/models/champion_model.keras:ro
    ports:
      - "5001:5001"
    networks:
      - visionguard-net

volumes:
  postgres_data:
    name: visionguard_postgres_data

networks:
  visionguard-net:
    name: visionguard_network
    driver: bridge
